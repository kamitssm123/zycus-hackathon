spring:
  application:
    name: slotmind-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hackathon}
    username: ${DB_USER:hackathon}
    password: ${DB_PASSWORD:hackathon}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate     # schema is owned by Flyway, never by Hibernate
    open-in-view: false      # no lazy loading in controllers; services return DTOs
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
  shutdown: graceful

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

  scheduling:
    strategy: ${SCHEDULING_STRATEGY:rule}      # runtime-switchable via PATCH /api/admin/scheduling
    fallback-strategy: rule
    horizon-days: ${SCHEDULING_HORIZON_DAYS:14}
    max-candidates: ${SCHEDULING_MAX_CANDIDATES:50}
    max-suggestions: ${SCHEDULING_MAX_SUGGESTIONS:3}
    max-fan-out: ${SCHEDULING_MAX_FAN_OUT:10}

  llm:
    enabled: ${LLM_ENABLED:true}          # false -> deterministic stub, for offline demos
    base-url: ${LLM_BASE_URL:https://litellm-qc.zycus.net/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:gpt-5.6-luna-azure-payg-global}
    product-header: ${LLM_PRODUCT_HEADER:PC1}
    timeout-ms: ${LLM_TIMEOUT_MS:8000}
    temperature: ${LLM_TEMPERATURE:0.2}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.slotmind: ${LOG_LEVEL_APP:DEBUG}
