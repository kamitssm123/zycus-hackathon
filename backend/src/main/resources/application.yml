spring:
  application:
    name: hackathon-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hackathon}
    username: ${DB_USER:hackathon}
    password: ${DB_PASSWORD:hackathon}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate     # schema is owned by Flyway, never by Hibernate
    open-in-view: false      # no lazy loading in controllers; services return DTOs
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
  shutdown: graceful

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.slotmind: ${LOG_LEVEL_APP:DEBUG}
